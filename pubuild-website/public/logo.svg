<svg width="200" height="60" viewBox="0 0 200 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Modern, professional logo for PU Build -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066CC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0047AB;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Icon: Abstract building blocks representing IT infrastructure -->
  <rect x="5" y="20" width="12" height="20" fill="url(#grad1)" rx="1"/>
  <rect x="20" y="12" width="12" height="28" fill="url(#grad1)" rx="1"/>
  <rect x="35" y="5" width="12" height="35" fill="url(#grad1)" rx="1"/>
  
  <!-- Company name -->
  <text x="55" y="32" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1a1a1a">PU</text>
  <text x="90" y="32" font-family="Arial, sans-serif" font-size="24" font-weight="300" fill="#0066CC">BUILD</text>
  
  <!-- Tagline -->
  <text x="55" y="45" font-family="Arial, sans-serif" font-size="8" font-weight="400" fill="#666" letter-spacing="1">ENTERPRISE IT SOLUTIONS</text>
</svg>
